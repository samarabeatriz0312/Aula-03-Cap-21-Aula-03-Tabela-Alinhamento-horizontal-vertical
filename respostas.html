<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela-Alinhamento-Horizontal-Vertical</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            /* lagura */
            width: 400px;
            /* Altura */
            height: 400px;
            /* Para unir as linhas entre as celulas */
            border-collapse: collapse;
        }

        td {
            border: 1px solid black;
            padding: 8px;
            /* Alinhamento horizontal 
                - center - centro
                - left - esquerda
                - right - direita
            */
            text-align: center;
            /* Alinhamento vertical
                - top - em cima
                - bottom - em baixo
                - middle - no centro
            */
            vertical-align: middle;
        }
        .esquerda{
            text-align: left;
            vertical-align: top;
        }
        .topo{
            vertical-align: top; 
        }
        .direita{
            text-align: right;
            vertical-align: top;
        }
        .baixo{
            text-align: middle;
            vertical-align: bottom;
        }
        .padrao{
            text-align: center;
            vertical-align: middle;
        }
        .direita-baixo{
            text-align: right;
            vertical-align: bottom;
        }
        .linha-fina{
            height: 50px;
            width: 50px;
        }
    </style>
</head>
<body>
    <h1>Minha primeira tabela</h1>
    <!-- É utilzado para criar organização de dados -->
    <!-- 
        Hierarquia de tabelas (Simples)
        Table = tabela
            Table Row = Linha da tabela
                Table Header = cabeçalho de tabela Data = dado da tabela Data = dado da tabela
    -->
    <table>
        <tr class="linha-fina"> <!-- Primeira linha -->
            <td class="esquerda">A1<br>(esquerda)
            </td>
            <td>B1<br>(padrão centro)</td>
            <td class="direita">C1<br>(direita)</td>
        </tr> <!-- Segunda linha -->
        <tr class="linha">
            <td class="topo">A2<br>(topo)</td>
            <td class="padrao">B2<br>(padrão)</td>
            <td class="baixo">C2<br>(baixo)</td>
        </tr>
        <tr><!-- Terceira linha -->
            <td class="topo">A3<br>(topo)</td>
            <td class="baixo">B3<br>(baixo)</td>
            <td class="padrao">C3<br>(padrão)</td>
        </tr>
        <tr class="linha-fina"> <!-- Quarta linha -->
            <td>A4</td>
            <td class="direita-baixo">1000<br>(número à direita)</td>
            <td>C4</td>
        </tr>

    </table>
    
</body>
</html>
